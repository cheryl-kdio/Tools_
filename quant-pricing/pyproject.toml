[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'
[project]
name = 'quant-pricing'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = ['numpy', 'scipy']
[project.optional-dependencies]
dev = ['pytest', 'jupyterlab', 'ipykernel']
[tool.setuptools.packages.find]
where = ['code/src']
